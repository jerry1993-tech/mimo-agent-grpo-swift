# =====================================================================
# GRPO - Music 域：无沙箱，单轮生成 ABC 记谱，规则 verifier 打分
# 用法：python swift_agent/train_entry.py configs/grpo_music.yaml
# mimo_env 对 music 域在第 1 个 step 直接用 MusicVerifier.score_text 给分并 done。
# =====================================================================
rlhf_type: grpo
model: XiaomiMiMo/MiMo-V2.6-Distill-Qwen-9B
dataset: data/outputs/grpo_music.jsonl

multi_turn_scheduler: gym_scheduler
gym_env: mimo_env
use_gym_env: true
max_turns: 1                  # music 单轮
completion_length_limit_scope: per_round

temperature: 1.0
top_p: 0.95
num_generations: 8
max_completion_length: 1024

use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.5
vllm_max_model_len: 16384

beta: 0.0
scale_rewards: none  # GRPO 仍会组内减均值；none=不除 std，对齐小米 norm_adv_by_std=false
epsilon: 0.2
advantage_estimator: grpo

per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 1.0e-6
lr_scheduler_type: constant
num_train_epochs: 1
gradient_checkpointing: true
max_length: 16384

save_steps: 100
logging_steps: 5
log_completions: true
output_dir: runs/grpo_music

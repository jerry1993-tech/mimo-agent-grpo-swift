# =====================================================================
# GRPO - General 域：多轮 MCP 工具 + LLM-as-Judge rubric
# 用法：python swift_agent/train_entry.py configs/grpo_general.yaml
# 前提：已配置 JUDGE_BASE_URL / JUDGE_API_KEY / JUDGE_MODEL（见 .env.example）。
# =====================================================================
rlhf_type: grpo
model: /root/autodl-tmp/models/MiMo-V2.6-Distill-Qwen-9B
model_type: qwen3_5   # 消歧（swift 自动匹配会在 qwen3_5/ovis_ocr2 间撞车）
template: qwen3_5      # 模板消歧（qwen3_5 vs qwen3_8 撞车；含 agent_template+thinking 处理）
dataset: data/outputs/grpo_general.jsonl

multi_turn_scheduler: gym_scheduler
gym_env: mimo_env
use_gym_env: true
max_turns: 10
completion_length_limit_scope: per_round

temperature: 1.0
top_p: 0.95
top_k: 20
num_generations: 8
max_completion_length: 2048

use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.5
vllm_max_model_len: 32768
vllm_enable_lora: true   # LoRA 训练必须开（rollout 权重同步）

beta: 0.0
scale_rewards: none  # GRPO 仍会组内减均值；none=不除 std，对齐小米 norm_adv_by_std=false
epsilon: 0.2
advantage_estimator: grpo

tuner_type: lora
lora_rank: 8
lora_alpha: 32
target_modules: all-linear
lora_dropout: 0.05

per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-6
lr_scheduler_type: constant
num_train_epochs: 1
gradient_checkpointing: true
max_length: 32768

save_steps: 50
logging_steps: 5
log_completions: true
output_dir: runs/grpo_general_lora

# =====================================================================
# SFT / IL 预热（可选阶段）
# 用法：swift sft configs/sft.yaml
# 说明：小米开源仓【只含 RL】，RL 直接从已蒸馏的 MiMo-V2.6-Distill-Qwen-9B 起步，
# 其多教师蒸馏(IL)代码未开源。本配置用于用“成功 rollout 轨迹”（data/prepare_sft.py
# 由 data/outputs/rollout_dump.jsonl 过滤 reward==1 生成）做等价 IL 预热。
# 数据为 ms-swift messages 格式（含 tool_call / tool_response）。
# =====================================================================
model: Qwen/Qwen3-8B
dataset: data/outputs/sft.jsonl
train_type: lora               # 资源充足可改 full
torch_type: bfloat16

num_train_epochs: 1
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
max_length: 32768
gradient_checkpointing: true
lora_rank: 16

save_steps: 100
logging_steps: 5
output_dir: runs/sft
